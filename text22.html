<style>
/* Floating Button Style */
.main-toggle-btn {
position: fixed;
bottom: 20px;
left: 20px;
z-index: 9999; /* Ensures it stays on top */
padding: 0px;
background-color: #FFA500;
color: white;
border: none;
border-radius: 50%;
font-weight: bold;
cursor: pointer;
box-shadow: 0 4px 15px rgba(0,0,0,0.3);

height: 70px;

#site1, #site2 { display: none; }
#site1 {
background-color: #0f172a !important;
min-height: 100vh;
width: 100%;
position: absolute; /* Ensures it layers correctly */

<script>
// This runs immediately as the browser reads the head
(function() {

document.write('<style>#' + savedSite + '{ display: block; }</style>');
})();

// "Backquote" is the name for the ` key
if (e.code === 'Backquote') {

});

</script>

<script>
// LOAD: Check what was saved when the page opens
window.addEventListener('DOMContentLoaded', () => {
const lastSite = localStorage.getItem("selectedSite");
if (lastSite === "site2") {
document.getElementById("site1").style.display = "none";
document.getElementById("site2").style.display = "block";
}
});

// TOGGLE: Switch sites and SAVE the choice
function toggleSites() {
const s1 = document.getElementById("site1");
const s2 = document.getElementById("site2");

if (s1.style.display === "none") {
//Switch to Site 1
s1.style.display = "block";
s2.style.display = "none";
localStorage.setItem("selectedSite", "site1"); // Save preference


} else {
//Switch to Site 2
s1.style.display = "none";
s2.style.display = "block";
localStorage.setItem("selectedSite", "site2"); // Save preference
}
}
</script>

<script>
const settings = document.getElementById('suggestions');
settings.addEventListener('click', () => {
document.getElementById('popupTitle').textContent = "Suggestions?";
const popupBody = document.getElementById('popupBody');
popupBody.innerHTML =` 
           <h4 style="text-align: center">Any Game you want to see added or <br> any Improvement you might want?</h4>
               <iframe 
               src="https://docs.google.com/forms/d/e/1FAIpQLScB9014ixTNlEUrC2k3GN8nFrSPkS5GlfLRaWIOGMVW2rslmQ/viewform"
               style="width:100%; height:290px; border:none; display:block;"
               loading="lazy">
               </iframe>
           `;
popupBody.contentEditable = false;
document.getElementById('popupOverlay').style.display = "flex";
});

// This targets every button with the "retro-btn" class
const retro = document.querySelectorAll('.retro-btn');

retro.forEach(btn => {
btn.addEventListener('click', (e) => {
// Essential to stop school-site 404 redirects
e.preventDefault();
e.stopPropagation();

document.getElementById('popupTitle').textContent = "Retro Bowl";
const popupBody = document.getElementById('popupBody');

popupBody.innerHTML = ` 
           <h4 style="text-align: center">
               <a href="https://tmorris01.github.io/gnlinks/rb.html">
                   <button class="settings-button" style="width: 40%; margin-right: 5%;">Retro Bowl</button>
               </a>
               <a href="https://tmorris01.github.io/gnlinks/college.html">
                   <button class="settings-button" style="width: 40%;">RB College</button>
               </a>
           </h4>
       `;

document.getElementById('popupOverlay').style.display = "flex";
});
});

// This targets every button with the "minecraft-btn" class
const allMineBtns = document.querySelectorAll('.minecraft-btn');

allMineBtns.forEach(btn => {
btn.addEventListener('click', (e) => {
// Essential to stop school-site 404 redirects
e.preventDefault();
e.stopPropagation();

document.getElementById('popupTitle').textContent = "Minecraft (Select Version)";
const popupBody = document.getElementById('popupBody');

popupBody.innerHTML = ` 
           <h4 style="text-align: center">
               <a href="https://tmorris01.github.io/gnlinks/1.12.html">
                   <button class="settings-button" style="width: 40%; margin-right: 5%;">Minecraft 1.12</button>
               </a>

});

function closePopup() {
document.getElementById('popupOverlay').style.display = "none";
}


</script>
