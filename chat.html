<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GN Chat</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">

<!-- Load Supabase FIRST, synchronously in head so it's always ready -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
    /* ── HARD RESET — prevent style.css leaking into this page ── */
    .main-toggle-btn { display: none !important; }
    header { background: var(--gradient-primary) !important; position: relative !important;
             box-shadow: var(--shadow-lg) !important; }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Syne', sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* ── HEADER ── */
    .chat-header {
        background: var(--gradient-primary) !important;
        padding: 0 1.5rem;
        height: 60px;
        display: flex !important;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        box-shadow: var(--shadow-lg);
        z-index: 10;
        width: 100%;
    }
    .chat-header-left { display: flex; align-items: center; gap: 12px; }
    .chat-logo {
        font-size: 1.3rem; font-weight: 800;
        color: white !important;
        -webkit-text-fill-color: white !important;
        background: none !important;
        letter-spacing: -0.02em;
        text-decoration: none;
    }

    /* online badge */
    .online-badge {
        display: flex; align-items: center; gap: 6px;
        background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);
        border: 1px solid rgba(255,255,255,0.2);
        padding: 4px 10px; border-radius: 20px;
        font-size: 12px; font-weight: 600; color: white;
        cursor: default; position: relative; transition: background 0.2s;
        user-select: none;
    }
    .online-badge:hover { background: rgba(255,255,255,0.25); }
    .online-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: #4ade80; box-shadow: 0 0 6px #4ade80;
        animation: pulse-dot 2s infinite; flex-shrink: 0;
    }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* hover tooltip */
    .online-tooltip {
        position: absolute; top: calc(100% + 8px); left: 0;
        background: rgba(15,23,42,0.97);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 10px; padding: 8px 12px;
        min-width: 150px; font-size: 12px; font-weight: 500;
        color: #f1f5f9; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        display: none; z-index: 200; white-space: nowrap;
    }
    .online-badge:hover .online-tooltip { display: block; }
    .online-tooltip-title {
        font-size: 10px; font-weight: 700; color: #64748b;
        text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px;
    }
    .online-tooltip-row {
        display: flex; align-items: center; gap: 7px; padding: 3px 0;
    }
    .online-tooltip-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; flex-shrink: 0; }

    /* header right buttons */
    .header-right { display: flex; align-items: center; gap: 8px; }
    .theme-btn {
        width: 36px; height: 36px; border-radius: var(--radius);
        border: 1px solid rgba(255,255,255,0.2);
        background: rgba(255,255,255,0.1); color: white;
        cursor: pointer; display: flex; align-items: center; justify-content: center;
        font-size: 16px; transition: all 0.2s; backdrop-filter: blur(10px);
        flex-shrink: 0;
    }
    .theme-btn:hover { background: rgba(255,255,255,0.2); }
    .username-btn {
        display: flex; align-items: center; gap: 8px;
        background: rgba(255,255,255,0.15);
        border: 1px solid rgba(255,255,255,0.3);
        color: white; padding: 6px 14px;
        border-radius: var(--radius); cursor: pointer;
        font-family: 'Syne', sans-serif;
        font-size: 13px; font-weight: 600;
        transition: all 0.2s; backdrop-filter: blur(10px);
        flex-shrink: 0;
    }
    .username-btn:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }

    /* ── CONNECTION BANNER ── */
    .conn-banner {
        text-align: center; font-size: 12px; padding: 6px;
        font-family: 'JetBrains Mono', monospace;
        background: #fef3c7; color: #92400e;
        display: none; flex-shrink: 0;
    }
    .conn-banner.show { display: block; }

    /* ── MESSAGES ── */
    .messages-wrap { flex: 1; overflow-y: auto; padding: 16px 0; }
    .messages-wrap::-webkit-scrollbar { width: 4px; }
    .messages-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .messages-inner {
        max-width: 820px; margin: 0 auto;
        padding: 0 16px;
        display: flex; flex-direction: column; gap: 2px;
    }

    /* ── BUBBLES ── */
    .msg {
        display: flex; flex-direction: column;
        animation: msg-in 0.2s cubic-bezier(0.4,0,0.2,1);
        max-width: 72%;
    }
    @keyframes msg-in { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
    .msg.mine   { align-self: flex-end;   align-items: flex-end; }
    .msg.theirs { align-self: flex-start; align-items: flex-start; }

    .msg-meta {
        display: flex; align-items: baseline; gap: 6px;
        margin-bottom: 3px; padding: 0 4px;
    }
    .msg.mine .msg-meta { flex-direction: row-reverse; }
    .msg-row { display: flex; align-items: flex-end; gap: 8px; }
    .msg.mine .msg-row { flex-direction: row-reverse; }

    .msg-avatar {
        width: 28px; height: 28px; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 11px; font-weight: 700; color: white; flex-shrink: 0;
    }
    .msg-username { font-size: 12px; font-weight: 700; }
    .msg-time { font-size: 11px; color: var(--text-light); font-family: 'JetBrains Mono', monospace; }

    .msg-bubble {
        padding: 9px 13px; font-size: 14px; line-height: 1.55;
        word-break: break-word; box-shadow: var(--shadow-xs);
    }
    .msg.theirs .msg-bubble {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: 4px 16px 16px 16px; color: var(--text);
    }
    .msg.mine .msg-bubble {
        background: var(--gradient-primary);
        border-radius: 16px 4px 16px 16px; color: white;
    }
    .msg.same-sender .msg-meta { display: none; }
    .msg.same-sender .msg-avatar { opacity: 0; pointer-events: none; }

    .msg-system {
        align-self: center; font-size: 11px; color: var(--text-light);
        font-family: 'JetBrains Mono', monospace;
        padding: 4px 12px; margin: 6px 0;
        background: var(--border-light); border-radius: 20px;
    }

    /* ── INPUT ── */
    .input-area {
        flex-shrink: 0; background: var(--bg-secondary);
        border-top: 1px solid var(--border); padding: 12px 16px;
    }
    .input-inner { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
    .input-box {
        flex: 1; background: var(--surface);
        border: 1.5px solid var(--border); border-radius: var(--radius);
        padding: 10px 14px; font-family: 'Syne', sans-serif;
        font-size: 14px; color: var(--text); outline: none;
        resize: none; min-height: 44px; max-height: 120px;
        transition: border-color 0.2s, box-shadow 0.2s; line-height: 1.5;
    }
    .input-box:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .input-box::placeholder { color: var(--text-light); }
    .input-box:disabled { opacity: 0.45; cursor: not-allowed; }

    .send-btn {
        width: 44px; height: 44px; border-radius: var(--radius);
        border: none; background: var(--gradient-primary);
        color: white; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        flex-shrink: 0; transition: all 0.2s; box-shadow: var(--shadow-sm);
    }
    .send-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: var(--shadow); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .cooldown-bar-wrap {
        height: 3px; background: var(--border); border-radius: 2px;
        overflow: hidden; margin-top: 8px;
        max-width: 820px; margin-left: auto; margin-right: auto; display: none;
    }
    .cooldown-bar-wrap.active { display: block; }
    .cooldown-bar { height: 100%; background: var(--gradient-primary); border-radius: 2px; }

    /* ── MODAL ── */
    .modal-overlay {
        position: fixed; inset: 0;
        background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
        display: none; align-items: center; justify-content: center;
        z-index: 9999; padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius-lg); padding: 32px;
        width: 100%; max-width: 360px; box-shadow: var(--shadow-xl);
        animation: pop-in 0.25s cubic-bezier(0.4,0,0.2,1);
    }
    @keyframes pop-in { from{transform:scale(0.92) translateY(16px);opacity:0} to{transform:scale(1) translateY(0);opacity:1} }
    .modal-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; color: var(--text); }
    .modal-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 22px; line-height: 1.5; }
    .modal-input {
        width: 100%; padding: 11px 14px;
        border: 1.5px solid var(--border); border-radius: var(--radius);
        background: var(--bg-secondary); color: var(--text);
        font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600;
        outline: none; margin-bottom: 14px;
        transition: border-color 0.2s, box-shadow 0.2s;
    }
    .modal-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .modal-btn {
        width: 100%; padding: 12px; border: none;
        border-radius: var(--radius); background: var(--gradient-primary);
        color: white; font-family: 'Syne', sans-serif;
        font-size: 15px; font-weight: 700; cursor: pointer;
        transition: all 0.2s; box-shadow: var(--shadow-sm);
    }
    .modal-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .modal-error { font-size: 12px; color: #ef4444; margin-top: -8px; margin-bottom: 10px; display: none; }
    .modal-error.show { display: block; }

    /* ── SCROLL BTN ── */
    .scroll-btn {
        position: fixed; bottom: 86px; right: 20px;
        width: 36px; height: 36px; border-radius: 50%;
        background: var(--gradient-primary); border: none;
        color: white; cursor: pointer; display: none;
        align-items: center; justify-content: center;
        box-shadow: var(--shadow-lg); z-index: 50; font-size: 16px;
    }
    .scroll-btn.show { display: flex; }

    /* ── EMPTY STATE ── */
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
    .empty-state .ei { font-size: 44px; margin-bottom: 12px; opacity: 0.35; }
    .empty-state p { font-size: 13px; line-height: 1.6; }

    @media (max-width: 600px) {
        .messages-inner { padding: 0 10px; }
        .input-area { padding: 10px; }
        .msg { max-width: 85%; }
    }
</style>
</head>
<body class="dark-mode">

<!-- USERNAME MODAL -->
<div class="modal-overlay" id="usernameModal">
    <div class="modal">
        <div class="modal-title">Welcome 👋</div>
        <div class="modal-sub">Set a username to start chatting. It'll be remembered next time.</div>
        <input class="modal-input" id="usernameInput" type="text" placeholder="Your username..." maxlength="24" autocomplete="off">
        <div class="modal-error" id="usernameError">Please enter a username.</div>
        <button class="modal-btn" id="usernameConfirm">Enter Chat →</button>
    </div>
</div>

<!-- HEADER -->
<header class="chat-header">
    <div class="chat-header-left">
        <span class="chat-logo">GN Chat</span>
        <div class="online-badge">
            <div class="online-dot"></div>
            <span id="onlineCount">—</span>
            <span>online</span>
            <div class="online-tooltip">
                <div class="online-tooltip-title">Currently Online</div>
                <div id="onlineList"><em style="color:#64748b">Loading...</em></div>
            </div>
        </div>
        <button href="https://tmorris01.github.io/gnlinks/" class="online-badge">HOME</button>
    </div>
    <div class="header-right">
        <button class="theme-btn" id="themeBtn">🌙</button>
        <button class="username-btn" id="changeUsernameBtn" title="Change username">
            ✏️ <span id="headerUsername">Set username</span>
        </button>
    </div>
</header>

<div class="conn-banner" id="connBanner"></div>

<!-- MESSAGES -->
<div class="messages-wrap" id="messagesWrap">
    <div class="messages-inner" id="messagesInner">
        <div class="empty-state" id="emptyState">
            <div class="ei">🗨️</div>
            <p>No messages yet.<br>Be the first to say something!</p>
        </div>
    </div>
</div>

<button class="scroll-btn" id="scrollBtn">↓</button>

<!-- INPUT -->
<div class="input-area">
    <div class="input-inner">
        <textarea class="input-box" id="msgInput"
            placeholder="Set a username to start chatting..."
            rows="1" maxlength="500" disabled></textarea>
        <button class="send-btn" id="sendBtn" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
        </button>
    </div>
    <div class="cooldown-bar-wrap" id="cooldownWrap">
        <div class="cooldown-bar" id="cooldownBar" style="width:0%"></div>
    </div>
</div>

<script>
// ════════════════════════════════════════════════
// CREDENTIALS
// ════════════════════════════════════════════════
const SUPABASE_URL  = 'https://oootjrtweyqrlegipyok.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vb3RqcnR3ZXlxcmxlZ2lweW9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE5MzcxNDQsImV4cCI6MjA4NzUxMzE0NH0.YCGWff6GH6nEN7nNQI8TQKvA4pTZrSff_oXc-sBdNr8';

const COOLDOWN_MS  = 5000;
const POLL_MS      = 2000;
const USERNAME_KEY = 'gnChatUsername';
const THEME_KEY    = 'gnChatTheme';

// ── STATE ─────────────────────────────────────
let username         = '';
let lastSendTime     = 0;
let cooldownRaf      = null;
let autoScroll       = true;
let lastRenderedUser = null;
let lastRenderedId   = 0;
let presenceChannel  = null;
let sb               = null; // supabase client

// ── HELPERS ───────────────────────────────────
const COLORS = ['#f59e0b','#10b981','#3b82f6','#8b5cf6',
                '#ec4899','#ef4444','#06b6d4','#84cc16','#f97316','#6366f1'];
function colorFor(name) {
    let h = 0;
    for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
    return COLORS[Math.abs(h) % COLORS.length];
}
function initials(n) { return n.trim().slice(0,2).toUpperCase(); }
function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtTime(ts) {
    return new Date(ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
}
function showBanner(msg) {
    const b = document.getElementById('connBanner');
    b.textContent = msg; b.classList.toggle('show', !!msg);
}

// ── THEME ─────────────────────────────────────
let isDark = localStorage.getItem(THEME_KEY) !== 'light';
function applyTheme() {
    document.body.classList.toggle('dark-mode', isDark);
    document.getElementById('themeBtn').textContent = isDark ? '🌙' : '☀️';
    localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
}
applyTheme();
document.getElementById('themeBtn').addEventListener('click', () => { isDark = !isDark; applyTheme(); });

// ── MODAL ─────────────────────────────────────
const modal   = document.getElementById('usernameModal');
const uInput  = document.getElementById('usernameInput');
const uError  = document.getElementById('usernameError');
const uBtn    = document.getElementById('usernameConfirm');

function openModal() {
    uInput.value = username || '';
    uError.classList.remove('show');
    modal.classList.add('open');
    setTimeout(() => { uInput.focus(); if (username) uInput.select(); }, 30);
}

function submitUsername() {
    const name = uInput.value.trim().replace(/\s+/g,' ');
    if (!name) { uError.classList.add('show'); return; }
    uError.classList.remove('show');
    const isNew = !username;
    username = name;
    localStorage.setItem(USERNAME_KEY, name);
    modal.classList.remove('open');
    document.getElementById('headerUsername').textContent = name;
    document.getElementById('msgInput').disabled = false;
    document.getElementById('msgInput').placeholder = 'Type a message... (Enter to send)';
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('msgInput').focus();
    // Rejoin presence with new name
    if (sb) joinPresence();
}

uBtn.addEventListener('click', submitUsername);
uInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submitUsername(); } });
document.getElementById('changeUsernameBtn').addEventListener('click', openModal);

// ── BOOT: check saved username ─────────────────
const savedName = localStorage.getItem(USERNAME_KEY);
if (savedName) {
    // Apply username immediately without modal
    username = savedName;
    document.getElementById('headerUsername').textContent = savedName;
    document.getElementById('msgInput').disabled = false;
    document.getElementById('msgInput').placeholder = 'Type a message... (Enter to send)';
    document.getElementById('sendBtn').disabled = false;
} else {
    // First time — show modal
    openModal();
}

// ── INIT SUPABASE ─────────────────────────────
// Supabase script is in <head> so guaranteed ready here
try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    loadHistory().then(() => {
        startPolling();
        if (username) joinPresence();
    });
} catch(e) {
    showBanner('⚠ Supabase failed to init — check console');
    console.error('Supabase init error:', e);
}

// ── FETCH HELPERS ─────────────────────────────
async function sbGet(path) {
    const r = await fetch(SUPABASE_URL + path, {
        headers: {
            'apikey': SUPABASE_ANON,
            'Authorization': 'Bearer ' + SUPABASE_ANON,
        }
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
}
async function sbPost(path, body) {
    const r = await fetch(SUPABASE_URL + path, {
        method: 'POST',
        headers: {
            'apikey': SUPABASE_ANON,
            'Authorization': 'Bearer ' + SUPABASE_ANON,
            'Content-Type': 'application/json',
            'Prefer': 'return=representation'
        },
        body: JSON.stringify(body)
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
}

// ── LOAD HISTORY ──────────────────────────────
async function loadHistory() {
    try {
        const msgs = await sbGet('/rest/v1/messages?order=id.asc&limit=200&select=*');
        if (msgs && msgs.length) {
            msgs.forEach(renderMessage);
            lastRenderedId = msgs[msgs.length - 1].id;
        }
    } catch(e) {
        showBanner('⚠ Could not load messages — check console');
        console.error('loadHistory error:', e);
    }
}

// ── POLL FOR NEW MESSAGES ─────────────────────
function startPolling() {
    setInterval(async () => {
        if (!lastRenderedId) return;
        try {
            const msgs = await sbGet(
                `/rest/v1/messages?id=gt.${lastRenderedId}&order=id.asc&select=*`
            );
            if (msgs && msgs.length) {
                msgs.forEach(renderMessage);
                lastRenderedId = msgs[msgs.length - 1].id;
            }
        } catch(e) { /* silent poll failure */ }
    }, POLL_MS);
}

// ── PRESENCE ──────────────────────────────────
function joinPresence() {
    if (presenceChannel) {
        presenceChannel.unsubscribe();
        presenceChannel = null;
    }
    // Use a unique key per tab so same-user multiple tabs each count
    const tabKey = username + '_' + Math.random().toString(36).slice(2,7);

    presenceChannel = sb.channel('gn-chat-presence', {
        config: { presence: { key: tabKey } }
    });

    presenceChannel
        .on('presence', { event: 'sync' }, () => {
            const state = presenceChannel.presenceState();
            // Collect unique usernames across all tabs
            const users = [];
            Object.values(state).forEach(presences => {
                presences.forEach(p => {
                    if (p.username && !users.find(u => u === p.username)) {
                        users.push(p.username);
                    }
                });
            });
            document.getElementById('onlineCount').textContent = users.length;
            document.getElementById('onlineList').innerHTML = users.length
                ? users.map(u => `
                    <div class="online-tooltip-row">
                        <div class="online-tooltip-dot"></div>
                        <span style="color:${colorFor(u)};font-weight:600">${esc(u)}</span>
                        ${u === username ? '<span style="color:#64748b;font-size:10px;margin-left:2px">(you)</span>' : ''}
                    </div>`).join('')
                : '<em style="color:#64748b">No one online</em>';
        })
        .subscribe(async status => {
            if (status === 'SUBSCRIBED') {
                await presenceChannel.track({ username, joined_at: Date.now() });
            }
        });
}

window.addEventListener('beforeunload', () => {
    if (presenceChannel) presenceChannel.untrack();
});

// ── RENDER MESSAGE ────────────────────────────
function renderMessage(msg) {
    const container = document.getElementById('messagesInner');
    const es = document.getElementById('emptyState');
    if (es) es.remove();

    if (msg.type === 'system') {
        const el = document.createElement('div');
        el.className = 'msg-system';
        el.textContent = msg.text;
        container.appendChild(el);
        lastRenderedUser = null;
    } else {
        const isMe       = msg.username === username;
        const sameSender = lastRenderedUser === msg.username;
        const color      = colorFor(msg.username);

        const el = document.createElement('div');
        el.className = ['msg', isMe ? 'mine' : 'theirs', sameSender ? 'same-sender' : '']
            .filter(Boolean).join(' ');

        el.innerHTML = `
            <div class="msg-meta">
                ${!isMe ? `<span class="msg-username" style="color:${color}">${esc(msg.username)}</span>` : ''}
                <span class="msg-time">${fmtTime(msg.created_at || Date.now())}</span>
            </div>
            <div class="msg-row">
                ${!isMe ? `<div class="msg-avatar" style="background:${color}">${initials(msg.username)}</div>` : ''}
                <div class="msg-bubble">${esc(msg.text)}</div>
            </div>`;

        container.appendChild(el);
        lastRenderedUser = msg.username;
    }

    if (autoScroll) document.getElementById('messagesWrap').scrollTop = 999999;
}

// ── SCROLL BUTTON ─────────────────────────────
const messagesWrap = document.getElementById('messagesWrap');
const scrollBtn    = document.getElementById('scrollBtn');
messagesWrap.addEventListener('scroll', () => {
    const dist = messagesWrap.scrollHeight - messagesWrap.scrollTop - messagesWrap.clientHeight;
    autoScroll = dist < 60;
    scrollBtn.classList.toggle('show', dist > 120);
});
scrollBtn.addEventListener('click', () => {
    autoScroll = true;
    messagesWrap.scrollTop = 999999;
    scrollBtn.classList.remove('show');
});

// ── SEND ──────────────────────────────────────
async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text  = input.value.trim();
    if (!text || !username) return;
    if (Date.now() - lastSendTime < COOLDOWN_MS) return;

    input.value = '';
    input.style.height = 'auto';
    lastSendTime = Date.now();
    startCooldown();

    try {
        const inserted = await sbPost('/rest/v1/messages',
            { username, text, type: 'chat' }
        );
        if (inserted && inserted.length) {
            renderMessage(inserted[0]);
            lastRenderedId = inserted[0].id;
        }
    } catch(e) {
        showBanner('⚠ Failed to send — check console');
        console.error('send error:', e);
    }
}

document.getElementById('sendBtn').addEventListener('click', sendMessage);
document.getElementById('msgInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('msgInput').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ── COOLDOWN ──────────────────────────────────
function startCooldown() {
    const sendBtn = document.getElementById('sendBtn');
    const input   = document.getElementById('msgInput');
    const barWrap = document.getElementById('cooldownWrap');
    const bar     = document.getElementById('cooldownBar');

    sendBtn.disabled = true;
    input.disabled   = true;
    barWrap.classList.add('active');
    bar.style.width  = '0%';

    const start = Date.now();
    const tick = () => {
        const elapsed = Date.now() - start;
        bar.style.width = Math.min((elapsed / COOLDOWN_MS) * 100, 100) + '%';
        if (elapsed < COOLDOWN_MS) {
            cooldownRaf = requestAnimationFrame(tick);
        } else {
            sendBtn.disabled = false;
            input.disabled   = false;
            barWrap.classList.remove('active');
            bar.style.width  = '0%';
            input.focus();
        }
    };
    cooldownRaf = requestAnimationFrame(tick);
}
</script>
